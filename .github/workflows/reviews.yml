name: Hämta Google-recensioner

on:
  schedule:
    - cron: "17 4 * * *"   # varje morgon ca 06:17 svensk tid
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reviews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta recensioner
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          PLACE_ID: ${{ vars.PLACE_ID }}
        run: python3 .github/scripts/reviews.py
      - name: Spara om något ändrats
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "Rasmustatts"
            git config user.email "rasmustatts@users.noreply.github.com"
            git add index.html
            git commit -m "Uppdatera Google-recensioner"
            git push
          fi
